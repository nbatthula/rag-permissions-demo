[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-permissions-demo"
version = "0.1.0"
description = "Minimal demo of permission-aware RAG: enforce ACLs at retrieval time, not as a post-filter."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pgvector = ["psycopg[binary]>=3.1"]
test = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
